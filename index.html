<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"></head><body><title>Spin Banner</title>
<style>
/* Layout: one full-bleed 16:9 stage (cover-fit), a single ghost slot in the centre, one quiet save control. */
:root {
  --bg: #000;
  --line: rgba(255, 255, 255, 0.34);
  --line-hi: rgba(255, 255, 255, 0.78);
  --glass: rgba(18, 20, 24, 0.46);
  --ink: #f2f3f5;
  --halo: rgba(170, 196, 255, 0.16);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
#stage {
  position: fixed; left: 50%; top: 50%;
  width: max(100vw, 177.7778vh); aspect-ratio: 16 / 9;
  transform: translate(-50%, -50%);
}
#stage img, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stage img { user-select: none; -webkit-user-drag: none; }

/* the slot where the logo lives: same footprint as the spinning tile */
#slot {
  position: absolute; left: 50.5%; top: 50.7%;
  width: 20.6%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border: 1.5px dashed var(--line); border-radius: 23%;
  background: radial-gradient(closest-side, var(--halo), transparent 75%);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  color: var(--line-hi);
  transition: border-color .25s, background-color .25s, opacity .3s;
  animation: bob 3.84s ease-in-out infinite;
}
#slot svg { width: 26%; height: 26%; transition: transform .25s; }
#slot:hover, #slot:focus-visible, body.drag #slot { border-color: var(--line-hi); background-color: rgba(255,255,255,.04); outline: none; }
#slot:hover svg, #slot:focus-visible svg { transform: scale(1.08) rotate(90deg); }
body.loaded #slot { border-color: transparent; background: none; animation: none; }
body.loaded #slot svg { opacity: 0; }
@keyframes bob { 0%,100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, calc(-50% - 0.5%)); } }

/* save control: hidden until there is something to save */
#save {
  position: fixed;
  right: calc(20px + env(safe-area-inset-right, 0px));
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 52px; height: 52px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--glass);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
  opacity: 0; pointer-events: none; transform: translateY(8px);
  transition: opacity .3s, transform .3s, border-color .2s;
}
body.loaded #save { opacity: 1; pointer-events: auto; transform: none; }
#save:hover, #save:focus-visible { border-color: var(--line-hi); outline: none; }
#save:disabled { cursor: progress; }
#save .ring { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); transform: rotate(-90deg); }
#save .ring circle { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; transition: stroke-dashoffset .15s linear, opacity .3s; }
#save.done .ring circle { opacity: 0; }
#save svg.icon { width: 20px; height: 20px; }

@media (prefers-reduced-motion: reduce) { #slot { animation: none; } }
</style>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GIFEncoder, quantize, applyPalette } from "https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js";

const W = 800, H = 450, FRAMES = 96, DELAY = 40, PERIOD = FRAMES * DELAY;
const $ = (id) => document.getElementById(id);
const hands = $("hands"), slot = $("slot"), save = $("save"), fileIn = $("file");
const ringCircle = save.querySelector(".ring circle");

/* ---------- 3D scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1600, 900, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// tile is 2 units tall and fills ~165px of the 450px-high banner
const camera = new THREE.PerspectiveCamera(20, 16 / 9, 0.1, 100);
camera.position.set(0, 0, 15.47);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(-4, 5, 6); scene.add(key);
const rimL = new THREE.DirectionalLight(0xdfe8ff, 1.6); rimL.position.set(-4, 1.5, -6); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0xdfe8ff, 1.6); rimR.position.set(4, 1, -6); scene.add(rimR);

function roundedSquare(h, r) {
  const s = new THREE.Shape();
  s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.quadraticCurveTo(h, -h, h, -h + r);
  s.lineTo(h, h - r); s.quadraticCurveTo(h, h, h - r, h);
  s.lineTo(-h + r, h); s.quadraticCurveTo(-h, h, -h, h - r);
  s.lineTo(-h, -h + r); s.quadraticCurveTo(-h, -h, -h + r, -h);
  return s;
}
const DEPTH = 0.06, BEV = 0.03;
const uvGen = {
  // picture fills each face; the back face is mirrored so it reads the right way round
  generateTopUV(g, v, a, b, c) {
    const f = (i) => {
      const x = v[i * 3], y = v[i * 3 + 1], z = v[i * 3 + 2];
      let u = (x + 1) / 2; const w = (y + 1) / 2;
      if (z < DEPTH / 2) u = 1 - u;
      return new THREE.Vector2(u, w);
    };
    return [f(a), f(b), f(c)];
  },
  // edges sample the picture's own border pixels, so the rim takes the image's colours
  generateSideWallUV(g, v, a, b, c, d) {
    const f = (i) => new THREE.Vector2((v[i * 3] + 1) / 2, (v[i * 3 + 1] + 1) / 2);
    return [f(a), f(b), f(c), f(d)];
  },
};
const geo = new THREE.ExtrudeGeometry(roundedSquare(0.97, 0.5), {
  depth: DEPTH, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelSegments: 6, curveSegments: 18, UVGenerator: uvGen,
});
geo.translate(0, 0, -DEPTH / 2);
const faceMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.08,
  emissive: 0xffffff, emissiveIntensity: 0.32, envMapIntensity: 0.5,
});
const tile = new THREE.Mesh(geo, [faceMat, faceMat]);
const pivot = new THREE.Group();
pivot.add(tile);
scene.add(pivot);
tile.visible = false;

function pose(t) {
  // lingers facing forward, then whips round: same motion as the original banner
  pivot.rotation.y = 2 * Math.PI * (t - 0.55 * Math.sin(2 * Math.PI * t) / (2 * Math.PI));
  pivot.position.y = 0.035 * Math.sin(2 * Math.PI * t);
}

let exporting = false;
function loop(now) {
  if (!exporting && tile.visible) { pose((now % PERIOD) / PERIOD); renderer.render(scene, camera); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- image in ---------- */
let texture = null, gifBlob = null, job = 0;

async function useFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  const ok = await new Promise((res) => {
    img.onload = () => res(true);
    img.onerror = () => res(false);
    img.src = url;
  });
  if (!ok || !img.naturalWidth) { URL.revokeObjectURL(url); return; }
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const x = c.getContext("2d");
  x.fillStyle = "#000"; x.fillRect(0, 0, 1024, 1024);
  const s = Math.max(1024 / img.naturalWidth, 1024 / img.naturalHeight);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  x.drawImage(img, (1024 - w) / 2, (1024 - h) / 2, w, h);
  URL.revokeObjectURL(url);

  if (texture) texture.dispose();
  texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  faceMat.map = texture; faceMat.emissiveMap = texture; faceMat.needsUpdate = true;
  tile.visible = true;
  document.body.classList.add("loaded");
  slot.setAttribute("aria-label", "Replace logo image");

  gifBlob = null;
  const mine = ++job;
  const blob = await buildGif(mine);
  if (blob && mine === job) { gifBlob = blob; offer(); }
}

/* ---------- GIF out ---------- */
// yield to the page between frames; a timer (not rAF) so export also finishes in a background tab
const nextFrame = () => new Promise((r) => setTimeout(r, 0));
function setProgress(p) {
  ringCircle.style.strokeDashoffset = String(100 - Math.round(p * 100));
}

async function buildGif(mine) {
  save.disabled = true; save.classList.remove("done"); setProgress(0);
  exporting = true;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  const frames = [];
  for (let k = 0; k < FRAMES; k++) {
    if (mine !== job) { exporting = false; return null; }
    pose(k / FRAMES);
    renderer.render(scene, camera);
    cx.drawImage(hands, 0, 0, W, H);
    cx.drawImage(renderer.domElement, 0, 0, W, H);
    frames.push(cx.getImageData(0, 0, W, H).data);
    setProgress((k + 1) / FRAMES * 0.5);
    if (k % 2 === 1) { exporting = false; await nextFrame(); exporting = true; }
  }
  exporting = false;

  // one shared palette from frames across the turn keeps the GIF clean and small
  const picks = [0, 12, 24, 36, 48, 72];
  const sample = new Uint8ClampedArray(W * H * 4 * picks.length);
  picks.forEach((p, i) => sample.set(frames[p], i * W * H * 4));
  const palette = quantize(sample, 256);

  const enc = GIFEncoder();
  for (let k = 0; k < FRAMES; k++) {
    if (mine !== job) return null;
    const index = applyPalette(frames[k], palette);
    enc.writeFrame(index, W, H, k === 0 ? { palette, delay: DELAY, repeat: 0 } : { delay: DELAY });
    setProgress(0.5 + (k + 1) / FRAMES * 0.5);
    if (k % 6 === 5) await nextFrame();
  }
  enc.finish();
  save.disabled = false; save.classList.add("done");
  return new Blob([enc.bytes()], { type: "image/gif" });
}

async function offer() {
  if (!gifBlob) return;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename: "banner.gif", data: gifBlob }); } catch { /* declined or busy: the save button stays */ }
    return;
  }
  // outside the Claude viewer (a plain browser tab) a normal download works
  const a = document.createElement("a");
  a.href = URL.createObjectURL(gifBlob);
  a.download = "banner.gif";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- wiring ---------- */
slot.addEventListener("click", () => fileIn.click());
fileIn.addEventListener("change", () => { useFile(fileIn.files[0]); fileIn.value = ""; });
save.addEventListener("click", offer);
addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drag"); });
addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("drag"); });
addEventListener("drop", (e) => { e.preventDefault(); document.body.classList.remove("drag"); useFile(e.dataTransfer.files[0]); });
addEventListener("paste", (e) => {
  const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
  if (f) useFile(f);
});
</script>
